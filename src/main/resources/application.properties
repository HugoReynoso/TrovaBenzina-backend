spring.application.name=trova-benzina-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trova_benzina}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Configure these with the official MIMIT Open Data URLs in the environment.
# They are intentionally blank by default to avoid relying on unverified URLs.
mimit.stations-url=${MIMIT_STATIONS_URL:}
mimit.prices-url=${MIMIT_PRICES_URL:}
mimit.import.cron=${MIMIT_IMPORT_CRON:0 0 3 * * *}
mimit.import.enabled=${MIMIT_IMPORT_ENABLED:true}
