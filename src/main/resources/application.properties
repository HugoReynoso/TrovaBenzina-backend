spring.application.name=trova-benzina-backend

spring.config.import=optional:file:.env.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trova_benzina}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}

app.security.jwt-secret=${JWT_SECRET:dev-secret-change-me-before-production-please}
app.security.jwt-expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
app.security.admin-email=${ADMIN_EMAIL:admin@trovabenzina.it}
app.security.admin-password=${ADMIN_PASSWORD:trova-admin}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

mimit.stations-url=${MIMIT_STATIONS_URL:}
mimit.prices-url=${MIMIT_PRICES_URL:}
mimit.import.cron=${MIMIT_IMPORT_CRON:0 0 3 * * *}
mimit.import.enabled=${MIMIT_IMPORT_ENABLED:false}